name: SkysongNPCs
version: '${version}'
main: org.skysongdev.skysongnpcs.SkysongNPCs
api-version: '1.21.11'
authors: [Ghiojo]
description: Gives Citizens NPCs owners, interaction groups, stat sheets, abilities and items.

# Citizens holds the NPCs, SkysongStats their stat sheets, and Skysong_Items the
# items that place and pick them up, so all three must enable first.
depend: [Citizens, SkysongStats, Skysong_Items]
# Optional: SkysongWardrobe for NPC wardrobes, LuckPerms for lp: groups, and
# WorldGuard for the npc-place region flag.
softdepend: [SkysongWardrobe, LuckPerms, WorldGuard]

# Downloaded by Paper on first start. The MySQL driver ships with Paper.
libraries:
  - com.zaxxer:HikariCP:6.2.1

permissions:
  skysongnpcs.admin:
    description: Staff. Do everything with every NPC (including /snpc adopt, release and owner server), and reload the plugin's files.
    default: op
  # M17
  skysongnpcs.place:
    description: Place NPCs from blueprint items.
    default: true
  # M12
  skysongnpcs.injuries:
    description: DMs. Award, remove and discover injuries and award or remove conditions on NPC stat sheets (/snpc injury, /snpc condition).
    default: op
