# Every text SkysongNPCs sends, in MiniMessage: https://docs.advntr.dev/minimessage/format.html
# <prefix> in any text is replaced by the prefix below. Words in <angle_brackets> that
# are not colours or styles are filled in by the plugin, as plain text.
#
# Texts missing from this file are added from the plugin's defaults on start and on
# /snpc reload, so new texts appear here after an update.

prefix: "<dark_aqua>[NPCs]</dark_aqua> "

# /snpc on its own. <version>: the plugin version.
info: "<prefix><gray>SkysongNPCs <white><version></white>."

reload:
  done: "<prefix><green>Reloaded config.yml and messages.yml."
  # <files>: the files with mistakes, which keep their previous values.
  failed: "<prefix><red>Not applied, because of a mistake in <files>. The previous values stay; the console says what is wrong."

# How an owner is written inside other texts (<owner>).
owner-name:
  # <player>: the player's name. <profile>: their character's profile.
  character: "<player> (<profile>)"
  server: "the server"

# Texts shared by the commands that act on one NPC. <npc>: the NPC's name.
npc:
  no-target: "<prefix><red>Look at the NPC you mean (staff can also /npc select it)."
  not-managed: "<prefix><red><npc> is not a Skysong NPC."
  not-owner: "<prefix><red>Only <npc>'s owner can do that, while playing that character."
  # <player>: the name typed.
  unknown-player: "<prefix><red>No player called <player> has played here."
  # <player>, <profile>: the names typed.
  unknown-profile: "<prefix><red><player> has no character called <profile>."
  no-active-profile: "<prefix><red><player> is not playing a character right now. Add the profile name after theirs."

# /snpc adopt [player] [profile] (staff): makes a plain Citizens NPC a Skysong NPC.
adopt:
  done: "<prefix><green><npc> is now a Skysong NPC owned by <owner>."
  already: "<prefix><red><npc> is already a Skysong NPC, owned by <owner>."

# /snpc release (staff): makes a Skysong NPC a plain Citizens NPC again.
release:
  done: "<prefix><green><npc> is a plain Citizens NPC again. Its Skysong data is deleted."

# /snpc owner [player [profile] | server]
owner:
  show: "<prefix><gray><npc> belongs to <white><owner></white>."
  done: "<prefix><green><npc> now belongs to <owner>."
  same: "<prefix><yellow><npc> already belongs to <owner>."

# /snpc access: who may do what with the NPC. <npc>: its name. <group>: a group,
# such as player:Alice or perm:my.node. <source>: who made a grant (owner-side, below,
# or a plugin's name). <actions>: action ids, comma separated.
access:
  owner-side: "owner"
  # <owner>: the NPC's owner.
  list-header: "<prefix><gray>Besides <owner> and staff, these may use <white><npc></white>:"
  list-entry: "<gray> - <white><group></white> <dark_gray>(<source>)</dark_gray>: <actions>"
  list-empty: "<prefix><gray>Only <owner> and staff may use <npc>."
  granted: "<prefix><green><group> now has <actions> on <npc>."
  revoked: "<prefix><green><group> now has only <actions> on <npc>."
  revoked-all: "<prefix><green><group> no longer has any access to <npc> from <source>."
  not-granted: "<prefix><yellow><group> has no access to <npc> from <source>."
  not-allowed: "<prefix><red>You may not change who can use <npc>."
  # <presets>: the preset names.
  no-actions: "<prefix><red>Name the actions after the group, or a preset: <presets>."
  # <word>: what was typed. <actions>, <presets>: every action and preset.
  unknown-action: "<prefix><red><word> is not an action or a preset.<newline><gray>Actions: <actions><newline>Presets: <presets>"
  # <types>: the group types other plugins added, or no-types below.
  bad-group: "<prefix><red><group> is not a group. Use player:NAME, \"player:NAME/PROFILE\", perm:NODE, or a type from another plugin: <types>."
  no-types: "none"
  bad-source: "<prefix><red><source> is not a plugin name."

# The NPC menu (right-click, or /snpc menu). Positions and items are in menus.yml.
menu:
  # The menu's title. <npc>: the NPC's name.
  title: "<dark_gray><npc>"
  # /snpc menu when the player may use none of its buttons.
  nothing: "<prefix><red>You can't do anything with <npc>."
  # The Information button. <npc>, <owner>, <template>, <state>.
  info:
    name: "<white><npc>"
    lore:
      - "<gray>Owner: <white><owner>"
      - "<gray>Template: <white><template>"
      - "<gray>State: <white><state>"
    no-template: "none"
    states:
      setup: "waiting for setup"
      placed: "placed"
      stored: "picked up"

# M11: stat sheets. <npc>: the NPC's name.
sheet:
  # The lines /snpc sheet shows, in MiniMessage with SkysongStats' sheet placeholders
  # ({strength}, {hp}, {max_hp}, {injuries}..., and {player} for the NPC's name). Empty
  # ([]) shows SkysongStats' own stats sheet, as its messages.yml lays it out.
  lines: []
  none: "<prefix><red><npc> has no stat sheet."
  not-allowed: "<prefix><red>You may not see <npc>'s stat sheet."
  already: "<prefix><red><npc> already has a stat sheet."
  created: "<prefix><green><npc> now has a stat sheet, every stat at its start value."
  # <template>: the template's id.
  created-from: "<prefix><green><npc> now has a stat sheet from template <template>."
  unknown-template: "<prefix><red>There is no NPC template called <template>."
  template-without-sheet: "<prefix><red>Template <template> gives no stat sheet."
  # <reason>: what went wrong, in English, such as a stat that left stats.yml.
  failed: "<prefix><red>Could not give <npc> a stat sheet: <reason>"

# /snpc stats <stat> <set|add|reduce> <amount> (staff). <stat>: the name typed.
stats:
  # <value>: the stat's total now.
  done: "<prefix><green><npc>'s <stat> is now <value>."
  unknown: "<prefix><red>There is no stat called <stat>."

# /snpc modifier [list | add <target> <amount> | del <id>] (staff).
# <id>: the modifier's id. <target>: its stat. <amount>: what it adds, with its sign.
modifier:
  header: "<prefix><gray><npc>'s modifiers:"
  entry: "<gray> - <white><id></white>: <target> <amount>"
  empty: "<prefix><gray><npc> has no modifiers."
  added: "<prefix><green>Added <amount> <target> to <npc> (modifier <id>)."
  removed: "<prefix><green>Removed modifier <id> from <npc>."
  not-found: "<prefix><red><npc> has no modifier <id>."
  unknown-target: "<prefix><red>There is no stat or bar max called <target>."

# /snpc proficiency <proficiency> <tier> (staff). <proficiency>, <tier>: the names typed.
proficiency:
  done: "<prefix><green><npc>'s <proficiency> is now <tier>."
  unknown: "<prefix><red>There is no proficiency called <proficiency>."
  unknown-tier: "<prefix><red>There is no tier called <tier>."
