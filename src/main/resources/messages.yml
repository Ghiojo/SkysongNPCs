# Every text SkysongNPCs sends, in MiniMessage: https://docs.advntr.dev/minimessage/format.html
# <prefix> in any text is replaced by the prefix below. Words in <angle_brackets> that
# are not colours or styles are filled in by the plugin, as plain text.
#
# Texts missing from this file are added from the plugin's defaults on start and on
# /snpc reload, so new texts appear here after an update.

prefix: "<dark_aqua>[NPCs]</dark_aqua> "

# /snpc on its own. <version>: the plugin version.
info: "<prefix><gray>SkysongNPCs <white><version></white>."

reload:
  done: "<prefix><green>Reloaded config.yml and messages.yml."
  # <files>: the files with mistakes, which keep their previous values.
  failed: "<prefix><red>Not applied, because of a mistake in <files>. The previous values stay; the console says what is wrong."

# How an owner is written inside other texts (<owner>).
owner-name:
  # <player>: the player's name. <profile>: their character's profile.
  character: "<player> (<profile>)"
  server: "the server"

# Texts shared by the commands that act on one NPC. <npc>: the NPC's name.
npc:
  no-target: "<prefix><red>Look at the NPC you mean (staff can also /npc select it)."
  not-managed: "<prefix><red><npc> is not a Skysong NPC."
  not-owner: "<prefix><red>Only <npc>'s owner can do that, while playing that character."
  # <player>: the name typed.
  unknown-player: "<prefix><red>No player called <player> has played here."
  # <player>, <profile>: the names typed.
  unknown-profile: "<prefix><red><player> has no character called <profile>."
  no-active-profile: "<prefix><red><player> is not playing a character right now. Add the profile name after theirs."

# /snpc adopt [player] [profile] (staff): makes a plain Citizens NPC a Skysong NPC.
adopt:
  done: "<prefix><green><npc> is now a Skysong NPC owned by <owner>, with a stat sheet."
  already: "<prefix><red><npc> is already a Skysong NPC, owned by <owner>."
  # Every Skysong NPC has a stat sheet; when SkysongStats will not make one, the NPC is not
  # adopted. <reason>: what went wrong, in English.
  failed: "<prefix><red>Could not adopt <npc>: its stat sheet could not be made (<reason>)."

# /snpc release (staff): makes a Skysong NPC a plain Citizens NPC again.
release:
  done: "<prefix><green><npc> is a plain Citizens NPC again. Its Skysong data is deleted."

# /snpc owner [player [profile] | server]
owner:
  show: "<prefix><gray><npc> belongs to <white><owner></white>."
  done: "<prefix><green><npc> now belongs to <owner>."
  same: "<prefix><yellow><npc> already belongs to <owner>."

# /snpc access: who may do what with the NPC. <npc>: its name. <group>: a group,
# such as player:Alice or perm:my.node. <source>: who made a grant (owner-side, below,
# or a plugin's name). <actions>: action ids, comma separated.
access:
  owner-side: "owner"
  # <owner>: the NPC's owner.
  list-header: "<prefix><gray>Besides <owner> and staff, these may use <white><npc></white>:"
  list-entry: "<gray> - <white><group></white> <dark_gray>(<source>)</dark_gray>: <actions>"
  list-empty: "<prefix><gray>Only <owner> and staff may use <npc>."
  granted: "<prefix><green><group> now has <actions> on <npc>."
  revoked: "<prefix><green><group> now has only <actions> on <npc>."
  revoked-all: "<prefix><green><group> no longer has any access to <npc> from <source>."
  not-granted: "<prefix><yellow><group> has no access to <npc> from <source>."
  not-allowed: "<prefix><red>You may not change who can use <npc>."
  # <presets>: the preset names.
  no-actions: "<prefix><red>Name the actions after the group, or a preset: <presets>."
  # <word>: what was typed. <actions>, <presets>: every action and preset.
  unknown-action: "<prefix><red><word> is not an action or a preset.<newline><gray>Actions: <actions><newline>Presets: <presets>"
  # <types>: the other group types: group (player groups), lp (with LuckPerms) and those
  # other plugins added; no-types below when there are none.
  bad-group: "<prefix><red><group> is not a group. Use player:NAME, \"player:NAME/PROFILE\", perm:NODE, or TYPE:NAME with one of these types: <types>."
  no-types: "none"
  bad-source: "<prefix><red><source> is not a plugin name."

# The NPC menu (right-click, or /snpc menu). Positions and items are in menus.yml.
menu:
  # The menu's title. <npc>: the NPC's name.
  title: "<dark_gray><npc>"
  # /snpc menu when the player may use none of its buttons.
  nothing: "<prefix><red>You can't do anything with <npc>."
  # The Information button. <npc>, <owner>, <template>, <state>.
  info:
    name: "<white><npc>"
    lore:
      - "<gray>Owner: <white><owner>"
      - "<gray>Template: <white><template>"
      - "<gray>State: <white><state>"
    no-template: "none"
    states:
      setup: "waiting for setup"
      placed: "placed"
      stored: "picked up"

# M11: stat sheets. <npc>: the NPC's name.
sheet:
  # The lines /snpc sheet shows, in MiniMessage with SkysongStats' sheet placeholders
  # ({strength}, {hp}, {max_hp}, {injuries}..., and {player} for the NPC's name). Empty
  # ([]) shows SkysongStats' own stats sheet, as its messages.yml lays it out.
  lines: []
  none: "<prefix><red><npc> has no stat sheet."
  not-allowed: "<prefix><red>You may not see <npc>'s stat sheet."
  already: "<prefix><red><npc> already has a stat sheet."
  created: "<prefix><green><npc> now has a stat sheet, every stat at its start value."
  # <template>: the template's id.
  created-from: "<prefix><green><npc> now has a stat sheet from template <template>."
  unknown-template: "<prefix><red>There is no NPC template called <template>."
  # <reason>: what went wrong, in English, such as a stat that left stats.yml.
  failed: "<prefix><red>Could not give <npc> a stat sheet: <reason>"
  # The NPC menu's Sheet button (stats-view): shows the sheet in chat, as /snpc sheet does.
  button:
    name: "<gold>Stat sheet"
    lore:
      - "<yellow>Click to see <npc>'s sheet in chat."

# /snpc stats <stat> <set|add|reduce> <amount> (staff). <stat>: the name typed.
stats:
  # <value>: the stat's total now.
  done: "<prefix><green><npc>'s <stat> is now <value>."
  unknown: "<prefix><red>There is no stat called <stat>."

# /snpc modifier [list | add <target> <amount> | del <id>] (staff).
# <id>: the modifier's id. <target>: its stat. <amount>: what it adds, with its sign.
modifier:
  header: "<prefix><gray><npc>'s modifiers:"
  entry: "<gray> - <white><id></white>: <target> <amount>"
  empty: "<prefix><gray><npc> has no modifiers."
  added: "<prefix><green>Added <amount> <target> to <npc> (modifier <id>)."
  removed: "<prefix><green>Removed modifier <id> from <npc>."
  not-found: "<prefix><red><npc> has no modifier <id>."
  unknown-target: "<prefix><red>There is no stat or bar max called <target>."

# /snpc proficiency <proficiency> <tier> (staff). <proficiency>, <tier>: the names typed.
proficiency:
  done: "<prefix><green><npc>'s <proficiency> is now <tier>."
  unknown: "<prefix><red>There is no proficiency called <proficiency>."
  unknown-tier: "<prefix><red>There is no tier called <tier>."

# --- M17: placing an NPC from a blueprint item ---
place:
  # <npc>: the new NPC's name.
  placed: "<prefix><green>Placed <npc>. It is waiting for its first setup."
  no-permission: "<prefix><red>You may not place NPCs."
  # <template>: the template id on the item.
  unknown-template: "<prefix><red>This item places an NPC template the server does not have (<template>). Tell staff."
  no-character: "<prefix><red>Play a character first: the NPC will belong to them."
  no-space: "<prefix><red>The NPC needs two free blocks above where you click."
  no-access-here: "<prefix><red>You cannot place NPCs here."
  # <limit>: the limit in config.yml.
  character-limit: "<prefix><red>This character already has <limit> NPC(s) out. Pick one up first."
  chunk-limit: "<prefix><red>This area already holds <limit> NPC(s)."
  failed: "<prefix><red>Something went wrong making the NPC, so it was not placed and you keep the item. The console says what."

# --- M5: access policies (/snpc policy) ---
# A policy is a named set of grants many NPCs follow at once. <policy>: its name.
# <owner>: who it belongs to. <members>: how many NPCs follow it. <npc>, <group> and
# <actions> as in access, above.
policy:
  # How a plugin's policy's owner is written. <plugin>: the plugin's name.
  owner-plugin: "plugin <plugin>"
  show: "<prefix><gray><npc> follows policy <white><policy></white> of <owner>."
  show-none: "<prefix><gray><npc> follows no policy."
  list-header: "<prefix><gray>Policies:"
  list-entry: "<gray> - <white><policy></white> <dark_gray>(<owner>)</dark_gray>: <members> NPC(s)"
  list-empty: "<prefix><gray>No policies yet. Make one with /snpc policy create <white>name</white>."
  info-header: "<prefix><gray>Policy <white><policy></white> of <owner>, followed by <members> NPC(s), lets in:"
  info-entry: "<gray> - <white><group></white>: <actions>"
  info-empty: "<prefix><gray>Policy <white><policy></white> of <owner> lets nobody in yet. <members> NPC(s) follow it."
  created: "<prefix><green>Made policy <policy>. Add grants with /snpc policy grant <policy> and put NPCs in it with /snpc policy assign <policy>."
  deleted: "<prefix><green>Deleted policy <policy>. Its <members> NPC(s) now follow no policy."
  taken: "<prefix><red>There is already a policy called <policy>."
  bad-id: "<prefix><red><policy> can't be a policy name: use lower-case letters, digits, - _ and . only."
  # <limit>: the limit in config.yml.
  limit: "<prefix><red>This character already has <limit> policies."
  unknown: "<prefix><red>There is no policy called <policy>."
  not-yours: "<prefix><red>Policy <policy> is not yours."
  no-character: "<prefix><red>Play a character first: policies belong to characters."
  granted: "<prefix><green><group> now has <actions> on every NPC following <policy>."
  revoked: "<prefix><green><group> now has only <actions> on NPCs following <policy>."
  revoked-all: "<prefix><green><group> no longer has any access through <policy>."
  not-granted: "<prefix><yellow>Policy <policy> gives <group> nothing."
  assigned: "<prefix><green><npc> now follows policy <policy>."
  already: "<prefix><yellow><npc> already follows policy <policy>."
  unassigned: "<prefix><green><npc> no longer follows policy <policy>."

# --- M9: inventory and equipment ---
# /snpc inventory [view], /snpc equip [view], and the menu's Inventory and Equipment
# buttons. Whoever may change them gets Citizens' own editor; whoever may only look gets a
# read-only copy. <npc>: the NPC's name.
containers:
  # Citizens' editors need the NPC in the world; a read-only copy does not.
  not-placed: "<prefix><red><npc> is not placed in the world, so its items can't be changed now. /snpc inventory view still shows them."
  inventory:
    view-title: "<dark_gray><npc>'s inventory (view only)"
    not-allowed: "<prefix><red>You may not see <npc>'s inventory."
    button:
      name: "<white>Inventory"
      lore-edit:
        - "<gray>Click to change what <npc> carries."
      lore-view:
        - "<gray>Click to see what <npc> carries."
  equipment:
    view-title: "<dark_gray><npc>'s equipment (view only)"
    not-allowed: "<prefix><red>You may not see <npc>'s equipment."
    button:
      name: "<white>Equipment"
      lore-edit:
        - "<gray>Click to change what <npc> wears and holds."
      lore-view:
        - "<gray>Click to see what <npc> wears and holds."

# --- M10: wardrobe (/snpc wardrobe and the menu's Wardrobe button). <npc>: the NPC's name. ---
wardrobe:
  # The menu button. lore-edit for players who may dress the NPC, lore-view for those who may only look.
  button:
    name: "<white>Wardrobe"
    lore-edit:
      - "<gray>Dress <white><npc></white>."
    lore-view:
      - "<gray>See what <white><npc></white> wears."
  # The title of the read-only view, for players with wardrobe-view only.
  view-title: "<dark_gray><npc>'s wardrobe"
  nothing-worn: "<prefix><gray><npc> wears nothing from a wardrobe."
  # Also sent when /sw npc or another plugin tries to open a managed NPC's wardrobe for them.
  not-allowed: "<prefix><red>You may not open <npc>'s wardrobe."
  view-only: "<prefix><red>You may only look at <npc>'s wardrobe: use /snpc wardrobe."
  stored: "<prefix><red><npc> is packed into its item, so its wardrobe stays closed."
  unavailable: "<prefix><red>NPC wardrobes need SkysongWardrobe, which is not running."
  not-found: "<prefix><red>Citizens no longer has <npc>."
  not-a-player-npc: "<prefix><red><npc> is not a player NPC, so it has no wardrobe."
  in-use: "<prefix><red>Someone else is dressing <npc> right now."
  closed: "<prefix><red>Wardrobes are closed until staff fix SkysongWardrobe's wardrobe.yml."
# --- M7: movement ---
# /snpc select, tphere, follow, look, and the menu's Movement button. <npc>: the NPC's name.
movement:
  selected: "<prefix><green>Selected <npc>. NPC commands act on it whenever you are not looking at another NPC."
  select-not-allowed: "<prefix><red>You can't do anything with <npc>."
  not-allowed: "<prefix><red>You may not do that with <npc>."
  not-placed: "<prefix><red><npc> is not out in the world."
  teleported: "<prefix><green>Brought <npc> to you."
  other-world: "<prefix><red><npc> is in another world."
  # <max>: config.yml's movement.teleport.max-distance.
  too-far: "<prefix><red><npc> is more than <max> blocks away."
  # <target>: who it follows. <distance>: how close it stays, in blocks.
  follow-on: "<prefix><green><npc> now follows <target>, staying <distance> blocks away."
  follow-off: "<prefix><green><npc> stopped following."
  # <max>: config.yml's movement.follow.max-distance.
  follow-above-max: "<prefix><red>NPCs can follow at most <max> blocks away."
  follow-not-others: "<prefix><red>NPCs can only follow the player who asks."
  # <player>: the name typed.
  player-offline: "<prefix><red><player> is not online."
  # <range>: in blocks.
  look-on: "<prefix><green><npc> now looks at players within <range> blocks."
  look-off: "<prefix><green><npc> stopped looking at players."
  # <max>: config.yml's movement.look.max-range.
  look-above-max: "<prefix><red>NPCs can look at most <max> blocks away."
  # The Movement button. Its lore shows only the lines the viewer may use.
  button:
    name: "<white>Movement"
    teleport: "<gray>Left-click: <white>bring here"
    # <state>: on or off, below.
    follow: "<gray>Right-click: <white>follow you <dark_gray>(<state>)"
    look: "<gray>Shift-click: <white>look at players <dark_gray>(<state>)"
    "on": "on"
    "off": "off"

# --- M4: player groups (/snpc group). A grant names one as group:NAME. ---
# <group>: the group's name. <owner>: who made it. <member>: a member, as written below.
group:
  list-header: "<prefix><gray>Groups you can change:"
  # <count>: how many members it has.
  list-entry: "<gray> - <white><group></white> <dark_gray>(<owner>)</dark_gray>: <count> member(s)"
  list-empty: "<prefix><gray>You have no groups. Make one with /snpc group create NAME."
  created: "<prefix><green>Made group <group>. Let it use an NPC with /snpc access grant group:<group> ACTIONS."
  # <grants>: how many grants named it, now gone.
  deleted: "<prefix><green>Deleted group <group>, and the <grants> grant(s) that named it."
  added: "<prefix><green><member> is now in <group>."
  removed: "<prefix><green><member> is no longer in <group>."
  already-member: "<prefix><yellow><member> is already in <group>."
  not-member: "<prefix><yellow><member> is not in <group>."
  info-header: "<prefix><gray>Group <white><group></white>, made by <owner>:"
  info-entry: "<gray> - <white><member>"
  info-empty: "<prefix><gray>Group <group>, made by <owner>, has no members."
  unknown: "<prefix><red>There is no group called <group>."
  taken: "<prefix><red>The name <group> is taken."
  bad-name: "<prefix><red><group> can't be a group name: use up to 32 lower-case letters, digits, - and _."
  not-yours: "<prefix><red>Only <owner> and staff can change group <group>."
  no-character: "<prefix><red>Play a character first: the group will belong to them."
  # <limit>: the limit in config.yml.
  group-limit: "<prefix><red>This character already has <limit> group(s)."
  member-limit: "<prefix><red><group> already has <limit> members."
  # How <member> is written. <player>: the player's name. <profile>: their character's profile.
  member-every: "<player> (every character)"
  member-character: "<player> (<profile>)"

# --- M12: injuries, conditions and ancestry on NPC stat sheets ---
# /snpc injury [list | award | remove | discover | forget <injury>] (staff, skysongnpcs.injuries).
# <npc>: the NPC's name. <injury>: the injury's name (or what was typed, when unknown).
injury:
  header: "<prefix><gray><npc>'s injuries:"
  # <severity>: its severity in injuries.yml.
  entry: "<gray> - <white><injury></white> (<severity>)"
  none: "<prefix><gray><npc> has no injuries."
  # <injuries>: every injury the NPC knows, comma separated.
  known: "<prefix><gray><npc> knows: <white><injuries>"
  unknown: "<prefix><red>There is no injury called <injury>."
  awarded: "<prefix><green><npc> now has <injury>."
  removed: "<prefix><green><npc> no longer has <injury>."
  not-had: "<prefix><red><npc> does not have <injury>."
  discovered: "<prefix><green><npc> now knows <injury>."
  already-known: "<prefix><red><npc> already knows <injury>."
  forgotten: "<prefix><green><npc> no longer knows <injury>."
  not-forgotten: "<prefix><red><npc> does not know <injury>, or has it now."

# /snpc condition [list | award <condition> [level] | remove <condition>] (staff, skysongnpcs.injuries).
# <condition>: the condition's name. <level>: its level now.
condition:
  header: "<prefix><gray><npc>'s conditions:"
  # <sources>: why the NPC has it: given directly, and the injuries and conditions that give it.
  entry: "<gray> - <white><condition> <level></white> <dark_gray>(<sources>)"
  source-direct: "given directly"
  none: "<prefix><gray><npc> has no conditions."
  unknown: "<prefix><red>There is no condition called <condition>."
  awarded: "<prefix><green><npc> now has <condition> at level <level>."
  removed: "<prefix><green>Took back <condition> from <npc>."
  not-direct: "<prefix><red><npc> was not given <condition> directly. If an injury gives it, remove the injury."

# /snpc ancestry [info <ancestry> | set <ancestry> [picks] | choose <picks> | rechoose | remove] (staff).
# <ancestry>: the ancestry's name. <id>: its id. <adjustments>: what it gives, like "dex +2, con +2".
ancestry:
  show: "<prefix><gray><npc>'s ancestry is <white><ancestry></white>, which gave: <white><adjustments>"
  pending: "<prefix><yellow>Its choices are still to be made: /snpc ancestry info <ancestry>, then /snpc ancestry choose."
  none: "<prefix><gray><npc> has no ancestry."
  unknown: "<prefix><red>There is no ancestry called <ancestry>."
  set: "<prefix><green><npc> is now <ancestry>."
  set-pending: "<prefix><green><npc> is now <ancestry>. Make its choices with /snpc ancestry choose (see /snpc ancestry info <id>)."
  chosen: "<prefix><green>Made <npc>'s <ancestry> choices."
  nothing-pending: "<prefix><red><npc> has no ancestry choices to make."
  rechosen: "<prefix><green><npc>'s ancestry choices are taken off; make them again with /snpc ancestry choose."
  no-choices: "<prefix><red><npc> has no ancestry with choices."
  removed: "<prefix><green><npc> no longer has an ancestry."
  # <reason>: what is wrong, in English. Picks are typed "1=dex,con 2=1": choice=stats or choice=package number.
  bad-picks: "<prefix><red>Those picks don't fit: <reason>. See /snpc ancestry info <id>."
  info:
    header: "<prefix><gray><ancestry> gives <white><adjustments></white>."
    no-choices: "<gray> It has no choices."
    # <number>: the choice's number to type. <amount>: what each pick gets. <picks>: how many stats.
    stats: "<gray> <white><number>=</white> <name>: <amount> to <picks> stat(s) from <from>"
    any-stat: "any setup stat"
    # <options>: the packages, numbered.
    packages: "<gray> <white><number>=</white> <name>: one of <options>"
# --- M8: appearance (/snpc name, skin, nameplate, pose, sit, glow, appearance) ---
# <npc>: the NPC's name.
appearance:
  not-allowed: "<prefix><red>You may not change that about <npc>."
  # Sent instead of Citizens' /npc, /trait... on a Skysong NPC, for anyone but staff.
  citizens-command: "<prefix><red><npc> is a Skysong NPC: change it with /snpc. Citizens' own commands are for staff."
  name:
    # <old>: the name before.
    done: "<prefix><green>Renamed <old> to <npc>."
    blank: "<prefix><red>Give the NPC a name."
    # <max>: the longest name allowed (config.yml).
    too-long: "<prefix><red>NPC names can be at most <max> characters long."
    formatting: "<prefix><red>You may not use colours or styles in NPC names."
  skin:
    # <skin>: the player whose skin it now wears.
    done: "<prefix><green><npc> now wears <skin>'s skin."
    # <source>: what was typed.
    bad-source: "<prefix><red><source> is neither a player name nor an http(s) link to a skin image."
    not-player-shaped: "<prefix><red><npc> is not player-shaped, so it has no skin."
    url-working: "<prefix><gray>Getting the skin for <npc>, this takes a few seconds..."
    url-done: "<prefix><green><npc> now wears the skin from that link."
    # <reason>: what went wrong, in English.
    url-failed: "<prefix><red>Could not get a skin from that link for <npc>: <reason>"
    # Only sent when SkysongWardrobe is installed: it draws an outfit over the new skin
    # the next time the wardrobe is closed.
    wardrobe-hint: "<prefix><gray>If <npc> wears an outfit, open and close its wardrobe to dress it again."
  nameplate:
    # <nameplate>: one of nameplates below.
    done: "<prefix><green><npc>'s name is now <nameplate>."
  nameplates:
    show: "always shown"
    hide: "hidden"
    hover: "shown when looked at"
  pose:
    # <pose>: one of poses below.
    done: "<prefix><green><npc> is now <pose>."
  poses:
    stand: "standing"
    crouch: "crouching"
    lie: "lying down"
  sit:
    "on": "<prefix><green><npc> sits down."
    "off": "<prefix><green><npc> gets up."
  sitting:
    "yes": "sitting"
    "no": "not sitting"
  glow:
    # <colour>: the colour's name.
    "on": "<prefix><green><npc> now glows <colour>."
    "off": "<prefix><green><npc> no longer glows."
    # <colours>: every colour.
    unknown: "<prefix><red><colour> is not a colour. Use off or one of: <colours>."
    none: "off"
  no-skin: "none"
  # The Appearance menu and the NPC menu's Appearance button. Every text may use <npc>,
  # and the menu's buttons also <skin>, <nameplate>, <pose>, <sitting> and <glow>: how the
  # NPC looks now.
  menu:
    title: "<dark_gray><npc>: appearance"
    button:
      name: "<white>Appearance"
      lore:
        - "<gray>Name, skin, nameplate, pose,"
        - "<gray>sitting and glowing"
    back:
      name: "<white>Back"
      lore: []
    name:
      name: "<white>Name"
      lore:
        - "<gray>Now: <white><npc>"
        - "<yellow>Click to type a new one"
      prompt: "<prefix><gray><click:suggest_command:'/snpc name '><u>Click here</u></click> and type <npc>'s new name."
    skin:
      name: "<white>Skin"
      lore:
        - "<gray>Now: <white><skin>"
        - "<yellow>Click to choose another"
      prompt: "<prefix><gray><click:suggest_command:'/snpc skin '><u>Click here</u></click> and type a player name or a link to a skin image for <npc>."
    nameplate:
      name: "<white>Nameplate"
      lore:
        - "<gray>Now: <white><nameplate>"
        - "<yellow>Click to change"
    pose:
      name: "<white>Pose"
      lore:
        - "<gray>Now: <white><pose>"
        - "<yellow>Click to change"
    sitting:
      name: "<white>Sitting"
      lore:
        - "<gray>Now: <white><sitting>"
        - "<yellow>Click to sit or get up"
    glow:
      name: "<white>Glowing"
      lore:
        - "<gray>Now: <white><glow>"
        - "<yellow>Left-click: on or off"
        - "<yellow>Right-click: next colour"
# --- M18: picking NPCs up into items (/snpc pickup, the menu's Pick up button) ---
# <npc>: the NPC's name.
pickup:
  picked-up: "<prefix><green>Picked <npc> up. Place its item to bring it back."
  not-allowed: "<prefix><red>You may not pick <npc> up."
  already-stored: "<prefix><red><npc> is picked up already."
  failed: "<prefix><red>Could not pick <npc> up: Citizens does not have it. Tell staff."
  # Lines added to the NPC item's lore. <owner>: who owns the NPC.
  item:
    # The item's name, only for NPCs that were not placed from a blueprint
    # (their item is config.yml's pickup.item).
    name: "<white><npc>"
    lore:
      - "<gray>Holds <white><npc></white>"
      - "<gray>Owner: <white><owner></white>"
  button:
    name: "<white>Pick up"
    lore:
      - "<gray>Click to pack <npc> into an item."

# Placing a picked-up NPC again from its item. <npc>: the NPC's name.
npc-item:
  returned: "<prefix><green>Placed <npc> again."
  npc-gone: "<prefix><red>The NPC this item held no longer exists."
  # A copy of the current item while the NPC is out. <world>, <x>, <y>, <z>: where it stands
  # (? when its chunk is not loaded).
  already-placed: "<prefix><red><npc> is already out, at <x> <y> <z> in <world>."
  # An item with an old ticket: a duplicate, or one kept from an earlier pickup.
  stale-item: "<prefix><red>This item no longer holds <npc>: a newer item does. Staff have been told."
  # Sent to online staff for every stale item. <player>: who tried to place it.
  stale-item-staff: "<prefix><gold><player> tried to place <npc> from a stale item (a duplicate or an old one)."
  not-yours: "<prefix><red>Only <npc>'s owner, or someone they let pick it up, may place it."

# /snpc reissue [player] (staff): a new item for the selected picked-up NPC.
# <npc>: the NPC's name. <player>: who gets the item.
reissue:
  done: "<prefix><green>Gave <player> a new item for <npc>. Every older item for it no longer works."
  placed: "<prefix><red><npc> is out in the world, not picked up. Use /snpc pickup instead."
  not-online: "<prefix><red><player> is not online."
  who: "<prefix><red>Name the player who gets the item: /snpc reissue <white>player</white>."

# --- M14: choices and first setup ---
# <npc>: the NPC's name. <points>: stat points. <stat>: a stat's id.
choices:
  # The Assign points button in the NPC menu. <pending>: choices left to make.
  button:
    name: "<gold>Assign points"
    lore:
      - "<gray>Choices to make: <white><pending>"
  # The same button while the NPC waits for its first setup.
  setup-button:
    name: "<gold>Set up"
    lore:
      - "<gray>This NPC is waiting for its first setup."
  not-allowed: "<prefix><red>You may not make <npc>'s choices."
  # Sent when the last setup step is confirmed.
  setup-complete: "<prefix><green><npc> is set up and ready."
  # /snpc respec (staff). <choices>: how many were given back.
  respec: "<prefix><green>Gave back <choices> choice(s) of <npc>."
  # /snpc respec <source>: only what one source's grants paid for. <source>: as typed.
  respec-source: "<prefix><green>Gave back <choices> choice(s) of <npc> paid for by <source>."
  back:
    name: "<gray>Back"
    lore: []
  # The choice menu, after setup.
  menu:
    title: "<dark_gray><npc>: choices"
    close:
      name: "<gray>Close"
      lore: []
  points:
    # The stat points page in the choice menu.
    icon:
      name: "<gold>Stat points"
      lore:
        - "<gray>Unspent: <white><points>"
        - "<gray>1 point = +1 to a stat."
    title: "<dark_gray><npc>: stat points"
    # One per stat. <base>: its base now, <cap>: the highest points may take it, <adding>: points put on it so far.
    stat:
      name: "<white><stat>"
      lore:
        - "<gray>Base: <white><base></white> (max <cap>)"
        - "<gray>Adding: <green>+<adding>"
        - "<dark_gray>Left-click +1, right-click -1"
    no-cap: "none"
    left:
      name: "<gold><points> point(s) left"
      lore: []
    confirm:
      name: "<green>Confirm"
      lore:
        - "<gray>Saves the points you put on."
        - "<gray>Points left over stay for later: <white><points>"
    spent: "<prefix><green><npc>: +<points> <stat>."
    # <reason>: why, such as "above cap".
    refused: "<prefix><red>Could not put <points> point(s) on <stat>: <reason>."
    # /snpc points (staff).
    granted: "<prefix><green>Gave <npc> <points> stat point(s)."
    taken: "<prefix><green>Took <points> unspent staff point(s) from <npc>."
    # <stats>: what was typed.
    unknown-stat: "<prefix><red>Not every stat in <stats> is a SkysongStats stat."
    list:
      empty: "<prefix><gray><npc> has no stat points."
      header: "<prefix><gray><npc>'s stat points (<points> unspent):"
      # <source>: who gave them, <amount>, <spent>, <stats>: where they may go.
      entry: "<gray> - <white><source></white>: <spent>/<amount> spent, on <stats>"
  # The ancestry step of the setup.
  ancestry:
    title: "<dark_gray><npc>: ancestry"
    other:
      name: "<white>Other"
      lore:
        - "<gray>No ancestry: for animals and creatures."
    other-name: "Other"
    # <ancestry>: the one picked.
    confirm:
      name: "<green>Confirm <ancestry>"
      lore: []
    # A stat a choice may raise. <amount>: by how much, with its sign.
    stat-option:
      name: "<white><stat> <amount>"
      lore: []
    package-line: "<gray><stat> <amount>"
    # <choice>: the choice's name, <picks>: how many to pick, <picked>: how many are picked.
    choice:
      name: "<gold><choice>"
      lore:
        - "<gray>Pick <white><picks></white> (<picked> picked)"
    next:
      name: "<green>Next"
      lore: []
    # <problems>: what SkysongStats says is wrong.
    problems: "<prefix><red>Those picks don't fit: <problems>"
    failed: "<prefix><red>SkysongStats did not take <ancestry>. Try again or tell staff."
    saved: "<prefix><green><npc> is now <ancestry>."

# M15: proficiency picks. <npc>: the NPC's name. <skill>, <proficiency>, <tier>: names
# from SkysongStats' skills.yml and proficiencies.yml. <left>: picks left.
picks:
  not-allowed: "<prefix><red>You may not make <npc>'s choices."
  # <proficiency> and <tier>: what was picked and the tier it went up to.
  picked: "<prefix><green><npc>'s <proficiency> is now <tier>."
  nothing: "<prefix><gray><npc> has nothing to pick right now."
  # The picks page of the choice menu, and the picks step of the setup. Each icon has a
  # name and lore.
  icon:
    name: "<gold>Proficiency picks"
    lore:
      - "<gray>Picks left: <white><left>"
  title: "<dark_gray>Pick <left> <skill> proficienc(ies)"
  # A proficiency that can be picked. <current>: its tier now.
  option:
    name: "<white><proficiency>"
    lore:
      - "<gray>Now: <white><current>"
      - "<gray>Picked: <white><tier>"
      - "<yellow>Click to select."
  selected:
    name: "<green><proficiency>"
    lore:
      - "<gray>Now: <white><current>"
      - "<gray>Picked: <white><tier>"
      - "<yellow>Click to unselect."
  left:
    name: "<gold><skill>"
    lore:
      - "<gray>Picks left: <white><left>"
      - "<gray>Each one goes up to <white><tier></white>."
  # Promotions: when a grant allows them, a proficiency it picked can go one tier further
  # for <cost> pick(s). <current>: its tier now. <next>: the tier it would go to.
  promote-option:
    name: "<aqua>Promote <proficiency>"
    lore:
      - "<gray>Now: <white><current>"
      - "<gray>Promoted: <white><next>"
      - "<gray>Costs <white><cost></white> pick(s)."
      - "<yellow>Click to select."
  promote-selected:
    name: "<green>Promote <proficiency>"
    lore:
      - "<gray>Now: <white><current>"
      - "<gray>Promoted: <white><next>"
      - "<gray>Costs <white><cost></white> pick(s)."
      - "<yellow>Click to unselect."
  # <tier>: the tier it went up to.
  promoted: "<prefix><green><npc>'s <proficiency> is promoted to <tier>."
  # <count>: how many are selected.
  confirm:
    name: "<green>Confirm <count> pick(s)"
    lore:
      - "<gray>Only staff can undo picks."
  # Why a pick was not saved.
  result:
    no-such-grant: "<prefix><red>Those picks are no longer there."
    nothing-picked: "<prefix><red>Pick a proficiency first."
    too-many: "<prefix><red>That is more picks than are left."
    unknown-proficiency: "<prefix><red>There is no proficiency called <proficiency>."
    wrong-skill: "<prefix><red>That proficiency is not of the right skill."
    not-an-option: "<prefix><red><proficiency> is already at <tier> or above, or picked already."
    no-sheet: "<prefix><red><npc> has no stat sheet."
  # /snpc picks
  list:
    none: "<prefix><gray><npc> has no proficiency picks."
    header: "<prefix><gray><npc>'s proficiency picks, <white><left></white> left:"
    # <count>: picks the grant gave; <source>: who gave them (template, staff, ability:<id>, a plugin).
    line: "<gray>- <white><skill></white> up to <white><tier></white>: <white><left></white> of <count> left (<source>)"
  none-for-skill: "<prefix><red><npc> has no <skill> picks left."
  unknown-skill: "<prefix><red>There is no skill called <skill>."
  # /snpc picks grant and take (staff). <count>: how many.
  granted: "<prefix><green><npc> got <count> <skill> pick(s) up to <tier>."
  # With promote-to. <promote>: the promotions' tier. <cost>: picks per promotion.
  granted-promoting: "<prefix><green><npc> got <count> <skill> pick(s) up to <tier>, which may promote up to <promote> for <cost> pick(s) each."
  promote-not-above: "<prefix><red>Promotions must go above <tier>, not to <promote>."
  # /snpc picks promote, when no grant can promote that proficiency.
  cannot-promote: "<prefix><red><npc> cannot promote <proficiency> now."
  taken: "<prefix><green>Took <count> unspent pick(s) from <source> away from <npc>."
# M16: abilities. <npc>: the NPC's name. <ability>: an ability's id as typed.
abilities:
  not-allowed: "<prefix><red>You may not see <npc>'s abilities."
  unknown: "<prefix><red>abilities.yml has no ability called <ability>."
  granted: "<prefix><green><npc> now has the ability <ability>."
  already: "<prefix><red><npc> already has the ability <ability>."
  revoked: "<prefix><green><npc> no longer has the ability <ability>."
  missing: "<prefix><red><npc> does not have the ability <ability>."
  # Staff revoke only staff's grant. When a plugin or the template also gave the ability, the
  # NPC keeps it. <sources>: who still holds it, such as "template, economy:module:trade".
  held-by-others: "<prefix><yellow><npc> keeps the ability <ability>: it is also held by <sources>."
  # /snpc abilities list, and /snpc abilities from the console.
  list:
    header: "<prefix><gray><npc>'s abilities:"
    empty: "<prefix><gray><npc> has no abilities."
  # The line under the stat sheet: the label, then every ability's name (hover for its
  # description), separated by the separator. NPCs without abilities get no line.
  sheet:
    label: "<gray>Abilities: "
    separator: "<gray>, "
  # The abilities menu: one icon per ability, its description as lore.
  menu:
    title: "<npc>'s abilities"
    # Put before every ability's name on its icon.
    ability-name: "<gold>"
    none: "<gray><npc> has no abilities."
  # The NPC menu's Abilities button. <count>: how many abilities the NPC has.
  button:
    name: "<gold>Abilities"
    lore:
      - "<gray>Abilities: <white><count>"
      - "<yellow>Click to see them."
