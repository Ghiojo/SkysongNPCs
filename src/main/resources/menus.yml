# The menu a Skysong NPC opens when right-clicked, or with /snpc menu.
#
# A player sees only the buttons they may use (their access to the NPC), and a
# player who would see none gets no menu: the click goes on to Citizens and
# other plugins as usual. Button names and lore are in messages.yml (menu:).
#
# Keys missing from this file are added from the plugin's defaults on start and
# on /snpc reload. A file with a YAML mistake is not applied.

npc-menu:
  # Rows of the menu, 1 to 6.
  rows: 3
  # false: right-clicking does nothing, and only /snpc menu opens it.
  open-on-right-click: true

  # Buttons by id. Other plugins' buttons have ids too, such as
  # "skysongeconomy:payroll", and can be added here the same way. Each may set:
  #   slot: where it goes, counted from 0 at the top left (row 2, column 5 is 13).
  #         A slot outside the menu or already taken moves it to the first free slot.
  #   material: draw it with this item instead (a Bukkit material name).
  #   hidden: true to leave it out for everyone.
  buttons:
    "skysongnpcs:info":
      slot: 13
      material: NAME_TAG
    # M9: inventory and equipment
    "skysongnpcs:inventory":
      slot: 15
      material: CHEST
    "skysongnpcs:equipment":
      slot: 16
      material: IRON_CHESTPLATE
    # M10: wardrobe. Dresses the NPC (wardrobe-edit) or shows what it wears (wardrobe-view).
    "skysongnpcs:wardrobe":
      slot: 14
      material: LEATHER_CHESTPLATE

    # M7: movement
    "skysongnpcs:movement":
      slot: 11
      material: LEAD
    # M8: appearance. Opens the Appearance menu (rename, skin or appearance).
    "skysongnpcs:appearance":
      slot: 12
      material: ARMOR_STAND
    # M18: pickup. Packs the NPC into its item (owner, staff or the pickup action).
    "skysongnpcs:pickup":
      slot: 22
      material: BUNDLE
    # M14: Assign points (setup while the NPC waits for it).
    "skysongnpcs:choices":
      slot: 10
      material: EXPERIENCE_BOTTLE

# --- M8: appearance ---
# The one-row menu the Appearance button opens. Its buttons are back, name, skin, nameplate, pose, sitting
# and glow; each may set slot (0 to 8) and material. Texts are in messages.yml
# (appearance.menu).
appearance-menu:
  buttons:
    back:
      slot: 0
      material: ARROW
    name:
      slot: 2
      material: NAME_TAG
    skin:
      slot: 3
      material: PLAYER_HEAD
    nameplate:
      slot: 4
      material: OAK_SIGN
    pose:
      slot: 5
      material: ARMOR_STAND
    sitting:
      slot: 6
      material: OAK_STAIRS
    glow:
      slot: 7
      material: GLOWSTONE_DUST
