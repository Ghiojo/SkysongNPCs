# SkysongNPCs settings.
#
# Keys missing from this file are added from the plugin's defaults on start and
# on /snpc reload, so new options appear here after an update. A file with a
# YAML mistake is not applied: the plugin keeps the values it read before and
# says so in the console.
#
# Each feature adds its own section here as it is released (access presets,
# choice rules, placing limits, follow distance).

# The MySQL database the NPC records are kept in, the same keys SkysongStats uses.
# The plugin creates its own tables (all named snpc_...) and does not start without
# the database. Read on start only: /snpc reload does not reconnect.
database:
  host: "localhost"
  port: "3306"
  user: "root"
  password: ""
  database_name: "skysong"

# Who may do what with NPCs besides their owner and staff (/snpc access).
access:
  # Shorthand for action lists: a preset's name can be typed wherever actions are,
  # as in /snpc access grant player:Alice customer. A grant keeps the actions it was
  # made with; changing a preset here does not change grants made from it before.
  # "all" always means every action.
  #
  # Actions: info, stats-view, abilities-view, wardrobe-view, inventory-view,
  # equipment-view, teleport, follow, look, wardrobe-edit, inventory-edit,
  # equipment-edit, rename, skin, appearance, choose, pickup, manage.
  # An -edit action includes its -view. Unknown actions in a preset are skipped.
  # A default preset you delete comes back on the next start; set it to [] instead.
  presets:
    customer: [info, stats-view, teleport, follow, look]
    viewer: [info, stats-view, abilities-view, wardrobe-view, inventory-view, equipment-view]
    caretaker: [info, stats-view, abilities-view, teleport, follow, look, wardrobe-edit, inventory-edit, equipment-edit]

# M11: stat sheets.
sheets:
  # How often, in seconds, the items each NPC carries are counted again toward its
  # item-tag stats (Arcrot...). Only NPCs whose items changed are sent to SkysongStats.
  # Read on start only.
  item-recount-seconds: 5

# --- M17: placing NPCs from blueprint items ---
# A blueprint is any SkysongItems item with the npc_blueprint tag set to a template id
# (/si tag set npc_blueprint guard_dog). Right-clicking the top of a block places the NPC
# there, owned by the character the player is playing, and uses up one item outside
# creative. With WorldGuard, regions decide through the npc-place flag: members may place,
# others only where it is set to allow.
placing:
  limits:
    # How many NPCs one character may have out in the world (picked-up ones do not count).
    # 0 for no limit. Staff (skysongnpcs.admin) are not limited.
    per-character: 0
    # How many Skysong NPCs one chunk may hold. 0 for no limit. Staff are not limited.
    per-chunk: 0

# --- M5: access policies ---
# A policy is a named set of grants many NPCs follow at once (/snpc policy). What an NPC
# allows is its policy's grants plus its own.
policies:
  # How many policies one character may make. 0 for no limit. Staff are not limited.
  per-character: 0

# --- M7: movement (/snpc tphere, follow, look, and the menu's Movement button) ---
# Limits for players with the teleport, follow and look actions. Owners are held to them
# too; staff (skysongnpcs.admin) are not. Distances are in blocks.
movement:
  teleport:
    # How far away an NPC may be brought from. 0 for any distance.
    max-distance: 0
    # Whether an NPC may be brought from another world.
    other-worlds: true
  follow:
    # How close a following NPC stays when no distance is given (and from the menu).
    default-distance: 3
    # The largest distance players may ask for.
    max-distance: 10
    # Whether players may make an NPC follow someone other than themselves.
    others: true
  look:
    # How far away players get looked at when no range is given (and from the menu).
    default-range: 5
    # The largest range players may ask for.
    max-range: 16

# --- M4: player groups (/snpc group) ---
# Named lists of characters a player makes, which a grant names as group:NAME.
# LuckPerms groups need no setup: a grant names them as lp:GROUP.
groups:
  # How many groups one character may make. 0 for no limit. Staff are not limited.
  per-character: 10
  # How many members one group may have. 0 for no limit. Staff are not limited.
  max-members: 50
