# An NPC template. Each file in this folder is one template, and its file name is the
# template's id (here: example), used by blueprint items and by /snpc sheet create.
# Ids are lowercase letters, digits and _. /snpc reload rereads the folder; a file with a
# mistake keeps its previous version and the console says what is wrong.

# The Citizens entity type, as Minecraft names it (PLAYER, WOLF, VILLAGER...). Default PLAYER.
entity-type: PLAYER

# The name a new NPC gets. Default: the template's id.
name: "Guard"

# Player NPCs only: the name of the player whose skin it wears. Leave it out for
# Citizens' default.
skin: ""

# Every Skysong NPC has a SkysongStats stat sheet. These are its starting base values, by
# SkysongStats stat id or alias (see SkysongStats' stats.yml). Stats left out start at their stats.yml start value. This example names
# none, so it works with any stats.yml; add lines such as:
#   strength: 3
stats: {}

# --- Choices and first setup ---
# The stat points a new NPC starts with, spent in its setup (1 point = +1 base). A blueprint
# item's npc_points tag replaces this. Default 0.
points: 0

# Optional: which stats this template's points may go on, and their caps, instead of
# config.yml's choices.stat-points. Either key may be left out.
#   stat-points:
#     eligible: [str, con]
#     max: {str: 8, con: 8}

# The SkysongStats ancestries (ids from its ancestries.yml) the setup offers. Empty: no
# ancestry step. An ancestry with choices asks for them right after.
ancestries: []

# Whether the ancestry step also offers Other: no ancestry, for animals and creatures.
allow-other: true

# The proficiency picks a new NPC starts with, made in its setup after the points: pick
# <count> proficiencies of a SkysongStats skill (id or alias from skills.yml), and each one
# goes up to <tier> (an id from proficiencies.yml's tiers). count defaults to 1. Only NPCs
# with a stat sheet get picks. Empty: no picks step. For example:
#   proficiency-picks:
#     - skill: metalworking
#       tier: proficient
#       count: 2
proficiency-picks: []

# M16: abilities from abilities.yml the NPC starts with. A blueprint's npc_abilities
# tag (a comma list) replaces this list.
abilities: []
